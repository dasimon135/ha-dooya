name: Feature request
description: Suggest a capability this integration does not have yet
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Worth knowing before you write: A Dooya motor sends nothing back. Anything that would need real feedback -- a confirmed position, an acknowledged command -- cannot be built on this hardware, only estimated.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the goal, not only the feature. The best solution is often not the one first imagined.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would it look like?
      description: Entity, service, option, ESPHome configuration - whatever form you have in mind.
    validations:
      required: false
  - type: textarea
    id: hardware
    attributes:
      label: Can you test it?
      description: |
        Only hardware someone actually owns can be verified. Say which motor and remote you can test a change on.
    validations:
      required: false
